<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        display: flex;
        flex-direction: column;
      }
      #jq-query {
      }
      .code-area {
        flex: 1;
        display: flex;
      }
      #json-input-container {
        flex: 1;
      }
      #json {
        width: 100%;
        padding: 0;
      }
      #result-container {
        flex: 1 1 0;
        max-width: 50%;
      }
      #result {
        padding: 0;
        margin: 0;
        text-overflow: clip;
        text-wrap: wrap;
      }
      * {
        font-family: monospace;
      }
      #error-area {
        color: red;;
      }

      /* query + completion list */
      .query-row {
        position: relative;
      }
      #jq-query {
        width: 100%;
        box-sizing: border-box;
      }
      .hint {
        color: #888;
      }
      .suggestions {
        position: absolute;
        left: 0;
        right: 0;
        top: 100%;
        z-index: 10;
        margin: 0;
        padding: 0;
        list-style: none;
        background: #fff;
        border: 1px solid #bbb;
        max-height: 16em;
        overflow-y: auto;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      }
      .suggestions li {
        display: flex;
        justify-content: space-between;
        gap: 1em;
        padding: 1px 6px;
        cursor: pointer;
      }
      .suggestions li.active {
        background: #cfe3ff;
      }
      .suggestions .label {
        white-space: pre;
      }
      .suggestions .detail {
        color: #777;
      }
    </style>
  </head>

  <body>
    <div>example: '[.[]|{address, unformattedPrice, beds, baths, area, flexFieldText, dateSold: .hdpData.homeInfo.dateSold, livingArea:.hdpData.homeInfo.livingArea, lotAreaValue:  .hdpData.homeInfo.lotAreaValue}]'</div>
    <div>jq query <span class="hint">(tab to complete, esc to dismiss)</span></div>

    <div class="query-row">
      <input id="jq-query" class="" autocomplete="off" spellcheck="false" />
      <ul id="suggestions" class="suggestions" hidden></ul>
    </div>
    <div>json <span id="error-area"></span></div>
    <div class="code-area">
      <div name="json-input-container" id="json-input-container" autocomplete="[{id: .[].id}]">
        <textarea id="json" class="" rows="20"></textarea>
      </div>
      <div id="result-container">
        <pre id="result"></pre>
      </div>
    </div>
  </body>
  <script type="module" src="./js/main.js"></script>
</html>
